name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动运行选题日报
    - cron: "0 0 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate YAML configs
        run: |
          python -c "
          import yaml, sys, glob
          errors = []
          for f in glob.glob('agents/*.yaml'):
              try:
                  with open(f) as fh:
                      cfg = yaml.safe_load(fh)
                  required = ['name', 'role', 'system_prompt']
                  missing = [k for k in required if k not in cfg]
                  if missing:
                      errors.append(f'{f}: missing {missing}')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: YAML parse error: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('✅ All agent configs valid')
          "

  daily-digest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run daily digest (dry-run for GitHub Actions demo)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements.txt
          python workflows/run_daily_digest.py \
            --keywords "AI,自媒体,一人公司" \
            --model claude-sonnet-5 \
            --output data/daily_digest_$(date +%Y%m%d).md \
            --dry-run || echo "⚠️ Set ANTHROPIC_API_KEY secret to enable live runs"
